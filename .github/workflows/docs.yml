name: docs
on:
  push:
    branches: [main]
    paths: ["docs/web/**", "mkdocs.yml", "flinch/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[analysis,docs]"
      - run: mkdocs gh-deploy --force --strict
