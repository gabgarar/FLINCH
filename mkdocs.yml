site_name: FLINCH
site_description: Does the Sun flinch when it flares? Solar flares in Sun-as-a-star radial velocities and spectra from NEID
site_url: https://gabgarar.github.io/FLINCH/
repo_url: https://github.com/gabgarar/FLINCH
repo_name: gabgarar/FLINCH
docs_dir: docs/web
site_dir: site
copyright: Copyright &copy; 2026 Gabriel García. BSD 3-Clause license.

theme:
  name: material
  language: en
  icon:
    logo: material/white-balance-sunny
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Data:
      - GOES flares: data/goes.md
      - NEID velocities: data/neid-velocities.md
      - NEID spectra: data/neid-spectra.md
  - Method: method.md
  - Results: results.md
  - Reproducing the results: reproduce.md
  - API reference:
      - Data: api/data.md
      - Velocity analysis: api/velocity.md
      - Spectra: api/spectra.md
  - References: references.md
  - Cite: cite.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
